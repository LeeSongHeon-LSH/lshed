name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js --version
      # 빌드된 CLI 를 임시 루트에서 끝까지 돌린다 (§10.1 2층). 단위 테스트가 못 보는
      # 셸 spawn, 경로 구분자, ${HOME} 확장, 파일 rename 같은 플랫폼 차이가 여기서 드러난다.
      - run: npm run smoke
