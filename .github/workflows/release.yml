name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run build
      - run: npm run binaries          # bun 이 한 대에서 모든 플랫폼을 교차 컴파일한다
      - run: LSHED_CLI=build/lshed-linux-x64 npm run smoke
      - working-directory: build
        run: sha256sum lshed-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: build/*
          generate_release_notes: true
          body: |
            Node 가 없는 기기는 아래 실행파일을 받아 PATH 에 두세요. Node 20+ 가 있으면 `npm install -g lshed` 가 더 가볍습니다.

            | 플랫폼 | 파일 |
            |---|---|
            | Windows x64 | `lshed-windows-x64.exe` |
            | macOS Apple Silicon | `lshed-darwin-arm64` |
            | macOS Intel | `lshed-darwin-x64` |
            | Linux x64 / arm64 | `lshed-linux-x64`, `lshed-linux-arm64` |

            macOS 와 Linux 는 받은 뒤 `chmod +x` 가 필요합니다. 서명하지 않았으므로 macOS 는 첫 실행에서 Gatekeeper 경고가 납니다.
